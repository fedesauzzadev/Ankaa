name: Ankaa dogfood

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ankaa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ankaa:
    name: action check (./action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (CLI bin for the action)
        run: pnpm build

      - name: Ankaa
        id: ankaa
        uses: ./action
        with:
          path: fixtures/petstore-mini.yaml
          cli: node packages/cli/bin/ankaa.js
          fail-on: never
          license-key: AGS-dev-20991231-2f6798197bf5

  ankaa-review:
    name: action review (./action, review-ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (CLI bin for the action)
        run: pnpm build

      - name: Ankaa review
        id: ankaa-review
        uses: ./action
        with:
          path: fixtures/petstore-mini.yaml
          review-ref: main
          cli: node packages/cli/bin/ankaa.js
          fail-on: never
          license-key: AGS-dev-20991231-2f6798197bf5
