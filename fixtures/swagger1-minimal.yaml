swaggerVersion: "1.2"
apiVersion: 1.0.0
basePath: https://api.example.com/v1
info:
  title: Legacy Pets 1.x
  description: Swagger 1.2 fixture for legacy conversion tests.
apis:
  - path: /pets/{id}
    operations:
      - method: GET
        nickname: getPetById
        summary: Get a pet by id
        notes: Returns a single pet with enough detail for tests.
        parameters:
          - name: id
            paramType: path
            type: string
            required: true
            description: Identifier of the pet.
        responseMessages:
          - code: 200
            message: A pet.
            responseModel: Pet
          - code: 404
            message: Not found.
models:
  Pet:
    id: Pet
    required:
      - id
    properties:
      id:
        type: string
        description: Identifier.
      name:
        type: string
