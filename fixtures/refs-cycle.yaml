openapi: 3.1.0
info:
  title: Ref Cycle
  version: 1.0.0
paths:
  /cycle:
    get:
      operationId: getCycle
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
components:
  schemas:
    Node:
      type: object
      properties:
        child:
          $ref: "#/components/schemas/Node"
        name:
          type: string
