openapi: 3.1.0
info:
  title: Orders API
  version: 1.1.0
  description: Candidate that removes POST /orders (BRK-001 positive).
servers:
  - url: https://api.example.com/v1
tags:
  - name: orders
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders with pagination
      description: Returns one page of orders for the caller.
      tags: [orders]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of orders to return.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "500":
          description: Unexpected server error.
components:
  schemas:
    Order:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, paid, shipped]
        total:
          type: number
          format: double
    OrderCreate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
        note:
          type: string
    OrderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
