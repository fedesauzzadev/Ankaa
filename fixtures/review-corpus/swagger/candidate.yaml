swagger: "2.0"
info:
  title: Users
  version: 1.1.0
  description: Candidate Swagger 2.0 contract (additive change) for the review corpus.
host: api.example.com
basePath: /v1
schemes: [https]
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users of the tenant
      description: Returns the users registered for the tenant.
      tags: [users]
      responses:
        "200":
          description: The user list.
  /users/{id}:
    get:
      operationId: getUserById
      summary: Fetch one user by identifier
      description: Returns a single user of the tenant.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the user.
          type: string
      responses:
        "200":
          description: The user.
components: {}
