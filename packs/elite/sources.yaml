# Snapshot of primary sources for the elite pack.
# Each rule also carries its own source.url (strictSource: true).
sources:
  - id: google-api-design
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
  - id: microsoft-rest
    title: Microsoft REST API Guidelines
    url: https://github.com/microsoft/api-guidelines
  - id: zalando
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
  - id: openapi-spec
    title: OpenAPI Specification
    url: https://spec.openapis.org/
  - id: rfc9110
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
  - id: rfc9457
    title: RFC 9457 Problem Details for HTTP APIs
    url: https://www.rfc-editor.org/rfc/rfc9457
  - id: rfc8594
    title: RFC 8594 Sunset HTTP Header
    url: https://www.rfc-editor.org/rfc/rfc8594
  - id: owasp-api
    title: OWASP API Security Top 10
    url: https://owasp.org/API-Security/
  - id: ietf-ratelimit
    title: IETF RateLimit Header Fields for HTTP
    url: https://datatracker.ietf.org/doc/draft-ietf-httpapi-ratelimit-headers/
  - id: rfc6749
    title: RFC 6749 OAuth 2.0
    url: https://www.rfc-editor.org/rfc/rfc6749
