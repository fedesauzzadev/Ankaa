# rules/performance.yaml — M1.5 inventory
- id: PERF-001
  category: performance
  severity: info
  message: "Spec file size budget warning (> 2 MB)."
  fix: "Split large specs or extract heavy examples/schemas into components."
  source:
    title: OpenAPI Specification
    url: https://spec.openapis.org/oas/v3.1.0
    section: "Document structure"
  when:
    op: inputSizeExceeds
    maxBytes: 2000000

- id: PERF-002
  category: performance
  severity: warning
  message: "429 responses should document RateLimit headers."
  fix: "Declare RateLimit-Limit (and ideally RateLimit-Remaining/Reset) response headers on 429 responses."
  examples:
    bad: |
      "429":
        description: Too many requests
    good: |
      "429":
        description: Too many requests
        headers:
          RateLimit-Limit:
            description: Request quota per window.
            schema:
              type: integer
  source:
    title: IETF RateLimit Header Fields for HTTP
    url: https://datatracker.ietf.org/doc/draft-ietf-httpapi-ratelimit-headers/
    section: "RateLimit-Limit"
  when:
    all:
      - op: responsePresent
        status: "429"
      - not:
          any:
            - op: headerRequired
              name: RateLimit-Limit
              in: response
            - op: headerRequired
              name: RateLimit-Remaining
              in: response
            - op: headerRequired
              name: RateLimit-Reset
              in: response
