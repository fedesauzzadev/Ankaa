# rules/docs.yaml — M1.3 skeleton + M1.5 full inventory
- id: DOCS-001
  category: docs
  severity: warning
  message: "Operation summary must be present and at least 10 characters."
  fix: "Add a descriptive summary (≥ 10 chars) to the operation."
  source:
    title: Microsoft REST API Guidelines
    url: https://github.com/microsoft/api-guidelines
    section: "Operation summary/description"
  when:
    not:
      op: descriptionMinLength
      target: summary
      min: 10

- id: DOCS-002
  category: docs
  severity: warning
  message: "Operation should document a `description`."
  fix: "Add a description explaining behavior, errors, and side effects."
  source:
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
    section: "Documentation"
  when:
    op: missingField
    field: description

- id: DOCS-003
  category: docs
  severity: info
  message: "Operation should declare at least one tag."
  fix: "Add a tag that matches a root-level tag entry."
  source:
    title: Microsoft REST API Guidelines
    url: https://github.com/microsoft/api-guidelines
    section: "Tags"
  when:
    op: missingField
    field: tags

- id: DOCS-004
  category: docs
  severity: warning
  message: "Every response must document a description."
  fix: "Add a description to each response entry."
  source:
    title: OpenAPI Specification
    url: https://spec.openapis.org/oas/v3.1.0
    section: "Response Object"
  when:
    op: responseDescriptionMissing

- id: DOCS-005
  category: docs
  severity: info
  message: "Top-level `info.description` is recommended."
  fix: "Add a description under `info` summarizing the API."
  source:
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
    section: "Documentation"
  when:
    op: docFieldMissing
    field: info.description

- id: DOCS-006
  category: docs
  severity: warning
  message: "`externalDocs` must include a `url` when present."
  fix: "Add `url` to externalDocs or remove the object."
  source:
    title: OpenAPI Specification
    url: https://spec.openapis.org/oas/v3.1.0
    section: "External Documentation Object"
  when:
    op: externalDocsMissingUrl
