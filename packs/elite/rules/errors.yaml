# rules/errors.yaml — M1.3 skeleton + M1.5 full inventory
- id: ERR-001
  category: errors
  severity: warning
  message: "Write operations should document at least one 4xx response."
  fix: "Document a 400/401/403/404/409 response for mutating operations."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "Errors"
  when:
    all:
      - op: method
        in: [post, put, patch, delete]
      - op: responseMissing
        status: "4xx"

- id: ERR-002
  category: errors
  severity: warning
  message: "Secured operations should distinguish 401 (unauthenticated) vs 403 (forbidden)."
  fix: "Document both 401 and 403 (or explain why only one applies)."
  source:
    title: Microsoft REST API Guidelines
    url: https://github.com/microsoft/api-guidelines
    section: "Authentication errors"
  when:
    all:
      - not:
          op: securityMissing
      - not:
          any:
            - op: responsePresent
              status: "401"
            - op: responsePresent
              status: "403"

- id: ERR-003
  category: errors
  severity: warning
  message: "Error media types should be consistent across operations."
  fix: "Use one error representation (e.g. application/problem+json) everywhere."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "Errors"
  when:
    op: errorMediaTypeInconsistent

- id: ERR-004
  category: errors
  severity: info
  message: "Prefer RFC 9457 `application/problem+json` for error bodies."
  fix: "Use application/problem+json instead of bare application/json for errors."
  source:
    title: RFC 9457 Problem Details for HTTP APIs
    url: https://www.rfc-editor.org/rfc/rfc9457
    section: "Problem Details"
  when:
    op: errorUsesJsonNotProblem

- id: ERR-005
  category: errors
  severity: warning
  message: "Public APIs should document at least one 5xx response."
  fix: "Document a 500 (or 5xx) response for unexpected server failures."
  source:
    title: Microsoft REST API Guidelines
    url: https://github.com/microsoft/api-guidelines
    section: "Server errors"
  when:
    op: missingAny5xx

- id: ERR-006
  category: errors
  severity: info
  message: "Error schemas should include a `title` field (RFC 9457 guidance)."
  fix: "Add `title` (and ideally `status`/`type`) to error object schemas."
  source:
    title: RFC 9457 Problem Details for HTTP APIs
    url: https://www.rfc-editor.org/rfc/rfc9457
    section: "Problem Details members"
  when:
    op: errorSchemaMissingTitle

- id: ERR-007
  category: errors
  severity: warning
  message: "429 and 503 responses should document a Retry-After header."
  fix: "Declare the Retry-After response header on throttled or unavailable responses."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "Retry-After"
  when:
    all:
      - any:
          - op: responsePresent
            status: "429"
          - op: responsePresent
            status: "503"
      - not:
          op: headerRequired
          name: Retry-After
          in: response

- id: ERR-008
  category: errors
  severity: warning
  message: "401 responses must document a WWW-Authenticate header."
  fix: "Declare the WWW-Authenticate response header describing the challenge."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "401 Unauthorized"
  when:
    all:
      - op: responsePresent
        status: "401"
      - not:
          op: headerRequired
          name: WWW-Authenticate
          in: response

- id: ERR-009
  category: errors
  severity: warning
  message: "407 responses must document a Proxy-Authenticate header."
  fix: "Declare the Proxy-Authenticate response header describing the challenge."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "407 Proxy Authentication Required"
  when:
    all:
      - op: responsePresent
        status: "407"
      - not:
          op: headerRequired
          name: Proxy-Authenticate
          in: response
