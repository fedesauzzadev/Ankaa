# rules/pagination.yaml — M1.5 inventory
- id: PAG-001
  category: pagination
  severity: warning
  message: "Collection GET endpoints should define a page/cursor/limit query parameter."
  fix: "Add a pagination parameter (page, cursor, limit, or offset)."
  source:
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
    section: "List methods / pagination"
  when:
    op: paginationParamMissing

- id: PAG-002
  category: pagination
  severity: warning
  message: "Page-size parameters should declare max/bounds guidance."
  fix: "Set `maximum` (and preferably `default`) on limit/pageSize parameters."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "Pagination"
  when:
    op: pageParamWithoutMax

- id: PAG-003
  category: pagination
  severity: info
  message: "Collection responses should document a total count field when provided."
  fix: "Expose `total`/`count` in list response schemas when the API knows it."
  source:
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
    section: "List methods"
  when:
    op: paginationTotalMissing

- id: PAG-004
  category: pagination
  severity: warning
  message: "206 Partial Content responses must document a Content-Range header."
  fix: "Declare the Content-Range response header on 206 responses."
  examples:
    bad: |
      "206":
        description: Partial content
    good: |
      "206":
        description: Partial content
        headers:
          Content-Range:
            description: Byte range returned.
            schema:
              type: string
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "206 Partial Content"
  when:
    all:
      - op: responsePresent
        status: "206"
      - not:
          op: headerRequired
          name: Content-Range
          in: response
