# rules/security.yaml — M1.3 skeleton + M1.5 full inventory
- id: SEC-001
  category: security
  severity: warning
  message: "Examples must not look like real secrets (passwords, tokens, API keys)."
  fix: "Replace example values with obvious placeholders (string, EXAMPLE, …)."
  source:
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
    section: "Security / examples"
  when:
    op: sensitiveExample

- id: SEC-002
  category: security
  severity: warning
  message: "Non-local servers must use https."
  fix: "Change server URLs to https:// (localhost/127.0.0.1 may use http)."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "https / TLS"
  when:
    op: serverInsecure

- id: SEC-003
  category: security
  severity: info
  message: "Avoid exposing sensitive fields (password, token) in 2xx response schemas."
  fix: "Remove or redact secret-like fields from success response models."
  source:
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
    section: "Security"
  when:
    op: sensitiveFieldInResponse

- id: SEC-004
  category: security
  severity: warning
  message: "OAuth scopes in security requirements must be defined by the scheme flows."
  fix: "Add the missing scopes to the OAuth2 flow definitions or remove them from requirements."
  examples:
    bad: |
      security:
        - oauth: [write]
      # flow defines only: read
    good: |
      security:
        - oauth: [read]
  source:
    title: RFC 6749 OAuth 2.0
    url: https://www.rfc-editor.org/rfc/rfc6749
    section: "Access Token Scope"
  when:
    op: undefinedOAuthScopes
