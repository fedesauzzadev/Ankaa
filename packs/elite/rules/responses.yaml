# rules/responses.yaml — M1.3 skeleton + M1.5 full inventory
- id: RESP-001
  category: structure
  severity: error
  message: "Each operation must document at least one 2xx or 3xx response."
  fix: "Add a 200/201/204 (or redirect) success response to the operation."
  source:
    title: OpenAPI Specification
    url: https://spec.openapis.org/oas/v3.1.0
    section: "Responses Object"
  when:
    all:
      - op: responseMissing
        status: "2xx"
      - op: responseMissing
        status: "3xx"

- id: RESP-002
  category: structure
  severity: warning
  message: "Collection GET responses should document an array or page shape."
  fix: "Model 200 responses as array or an object with items/data/results."
  source:
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
    section: "List methods"
  when:
    op: collectionGetNonArrayResponse

- id: RESP-003
  category: structure
  severity: warning
  message: "204 No Content responses must not declare a response body."
  fix: "Remove `content` from 204 responses."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "204 No Content"
  when:
    op: responseHasContent
    status: "204"

- id: RESP-004
  category: structure
  severity: warning
  message: "Redirect (3xx) responses should document a Location header."
  fix: "Declare the Location response header on redirect responses."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "Location"
  when:
    op: redirectMissingLocation

- id: RESP-005
  category: structure
  severity: info
  message: "Consider documenting a `default` response for unknown errors."
  fix: "Add a `default` response describing unexpected failures."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "Errors"
  when:
    not:
      op: responsePresent
      status: default
