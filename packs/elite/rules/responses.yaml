# rules/responses.yaml — M1.3 skeleton + M1.5 full inventory
- id: RESP-001
  category: structure
  severity: error
  message: "Each operation must document at least one 2xx or 3xx response."
  fix: "Add a 200/201/204 (or redirect) success response to the operation."
  source:
    title: OpenAPI Specification
    url: https://spec.openapis.org/oas/v3.1.0
    section: "Responses Object"
  when:
    all:
      - op: responseMissing
        status: "2xx"
      - op: responseMissing
        status: "3xx"

- id: RESP-002
  category: structure
  severity: warning
  message: "Collection GET responses should document an array or page shape."
  fix: "Model 200 responses as array or an object with items/data/results."
  source:
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
    section: "List methods"
  when:
    op: collectionGetNonArrayResponse

- id: RESP-003
  category: structure
  severity: warning
  message: "204 No Content responses must not declare a response body."
  fix: "Remove `content` from 204 responses."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "204 No Content"
  when:
    op: responseHasContent
    status: "204"

- id: RESP-004
  category: structure
  severity: warning
  message: "Redirect (3xx) responses should document a Location header."
  fix: "Declare the Location response header on redirect responses."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "Location"
  when:
    op: redirectMissingLocation

- id: RESP-005
  category: structure
  severity: info
  message: "Consider documenting a `default` response for unknown errors."
  fix: "Add a `default` response describing unexpected failures."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "Errors"
  when:
    not:
      op: responsePresent
      status: default

- id: RESP-006
  category: structure
  severity: warning
  message: "GET operations must not define a request body."
  fix: "Remove requestBody from the GET operation (use query parameters instead)."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "GET / content semantics"
  when:
    all:
      - op: method
        in: [get]
      - op: presentField
        field: requestBody

- id: RESP-007
  category: structure
  severity: warning
  message: "POST operations should document a 201 Created response."
  fix: "Add a 201 response returning the created resource."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "POST / resource creation"
  when:
    all:
      - op: method
        in: [post]
      - not:
          op: responsePresent
          status: "201"

- id: RESP-008
  category: structure
  severity: warning
  message: "GET 200 responses should define response content."
  fix: "Add a content schema to the 200 response."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "Responses"
  when:
    all:
      - op: method
        in: [get]
      - op: responsePresent
        status: "200"
      - not:
          op: responseHasContent
          status: "200"

- id: RESP-009
  category: structure
  severity: warning
  message: "PUT 200 responses should return the updated resource."
  fix: "Add a content schema with the updated resource to the 200 response."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "Responses"
  when:
    all:
      - op: method
        in: [put]
      - op: responsePresent
        status: "200"
      - not:
          op: responseHasContent
          status: "200"

- id: RESP-010
  category: structure
  severity: warning
  message: "PUT, PATCH and DELETE operations should document a 404 response."
  fix: "Add a 404 response for unknown resource identifiers."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "Errors"
  when:
    all:
      - op: method
        in: [put, patch, delete]
      - not:
          op: responsePresent
          status: "404"

- id: RESP-011
  category: structure
  severity: warning
  message: "405 responses must document an Allow header."
  fix: "Declare the Allow response header listing supported methods."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "405 Method Not Allowed"
  when:
    all:
      - op: responsePresent
        status: "405"
      - not:
          op: headerRequired
          name: Allow
          in: response

- id: RESP-012
  category: structure
  severity: warning
  message: "202 Accepted responses should document a Location header."
  fix: "Add a Location header pointing at the status monitor."
  source:
    title: Microsoft REST API Guidelines
    url: https://github.com/microsoft/api-guidelines
    section: "Long-running operations"
  when:
    all:
      - op: responsePresent
        status: "202"
      - not:
          op: headerRequired
          name: Location
          in: response

- id: RESP-013
  category: structure
  severity: warning
  message: "POST, PUT and PATCH operations with a body must document a 400 response."
  fix: "Add a 400 response describing malformed input."
  source:
    title: Zalando RESTful API Guidelines
    url: https://opensource.zalando.com/restful-api-guidelines/
    section: "Errors"
  when:
    all:
      - op: method
        in: [post, put, patch]
      - op: presentField
        field: requestBody
      - not:
          op: responsePresent
          status: "400"

- id: RESP-014
  category: structure
  severity: warning
  message: "POST 200 responses should return the resource with content."
  fix: "Add a content schema to the 200 response or use 201/204."
  source:
    title: Microsoft REST API Guidelines
    url: https://github.com/microsoft/api-guidelines
    section: "POST responses"
  when:
    all:
      - op: method
        in: [post]
      - op: responsePresent
        status: "200"
      - not:
          op: responseHasContent
          status: "200"

- id: RESP-015
  category: structure
  severity: warning
  message: "PUT and PATCH operations must define a request body."
  fix: "Add a requestBody with the replacement or patch document."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "PUT / PATCH semantics"
  when:
    all:
      - op: method
        in: [put, patch]
      - op: missingField
        field: requestBody

- id: RESP-016
  category: structure
  severity: warning
  message: "HEAD and OPTIONS operations must not define a request body."
  fix: "Remove requestBody from the HEAD/OPTIONS operation."
  source:
    title: RFC 9110 HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    section: "HEAD / OPTIONS semantics"
  when:
    all:
      - op: method
        in: [head, options]
      - op: presentField
        field: requestBody
