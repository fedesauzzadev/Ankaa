# rules/structure.yaml — M1.3 skeleton + M1.5 full inventory
- id: STRUCT-001
  category: structure
  severity: error
  message: "OpenAPI document must declare a 3.x `openapi` version."
  fix: "Set `openapi: 3.1.0` (or 3.0.x) at the document root."
  source:
    title: OpenAPI Specification
    url: https://spec.openapis.org/oas/v3.1.0
    section: "Versions"
  when:
    op: openapiVersionMismatch
    pattern: '^3\.'

- id: STRUCT-002
  category: structure
  severity: error
  message: "OpenAPI document must declare `info.title`."
  fix: "Add a human-readable title under `info`."
  examples:
    bad: |
      info:
        version: "1.0.0"
    good: |
      info:
        title: Pet Store
        version: "1.0.0"
  source:
    title: OpenAPI Specification
    url: https://spec.openapis.org/oas/v3.1.0
    section: "Info Object"
  when:
    op: docFieldMissing
    field: info.title

- id: STRUCT-003
  category: structure
  severity: error
  message: "OpenAPI document must declare `info.version`."
  fix: "Add a version string under `info`."
  source:
    title: OpenAPI Specification
    url: https://spec.openapis.org/oas/v3.1.0
    section: "Info Object"
  when:
    op: docFieldMissing
    field: info.version

- id: STRUCT-004
  category: structure
  severity: warning
  message: "OpenAPI document should declare `servers`."
  fix: "Add a `servers` array at the document root."
  source:
    title: Microsoft REST API Guidelines
    url: https://github.com/microsoft/api-guidelines
    section: "Versioning / base URL"
  when:
    op: docFieldMissing
    field: servers

- id: STRUCT-005
  category: structure
  severity: warning
  message: "Root `tags` should be declared when operations use tags."
  fix: "Declare tag objects under the root `tags` array."
  source:
    title: Microsoft REST API Guidelines
    url: https://github.com/microsoft/api-guidelines
    section: "Tags"
  when:
    op: operationTagsWithoutRootTags

- id: STRUCT-006
  category: structure
  severity: info
  message: "Prefer reusable `components.schemas` over deeply nested inline schemas."
  fix: "Extract repeated object shapes into components.schemas and $ref them."
  source:
    title: Google API Design Guide
    url: https://cloud.google.com/apis/design
    section: "Schema definitions"
  when:
    op: schemaInlineDepthMax
    max: 4

- id: STRUCT-007
  category: structure
  severity: info
  message: "Prefer OpenAPI 3.1 over older 3.0 documents."
  fix: "Upgrade the spec to OpenAPI 3.1."
  source:
    title: OpenAPI Specification
    url: https://spec.openapis.org/
    section: "Versions"
  when:
    op: openapiVersionMismatch
    pattern: "^3[.]1[.]"
